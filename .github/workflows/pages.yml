name: Publicar web

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "data/offers.json"
      - "chrome-extension/icons/icon-48.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Preparar sitio
        shell: bash
        run: |
          mkdir -p _site/data _site/assets
          cp -R docs/. _site/
          cp data/offers.json _site/data/offers.json
          cp chrome-extension/icons/icon-48.png _site/assets/icon-48.png
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
